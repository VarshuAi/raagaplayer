name: raaga_music_player
description: A premium Material 3 Flutter design system for Raaga.
version: 2.0.0+200

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  just_audio: ^0.9.38
  youtube_explode_dart: ^3.1.0
  audio_service: ^0.18.12
  audio_session: ^0.1.19
  on_audio_query: ^2.9.0
  palette_generator: ^0.3.3
  flutter_cache_manager: ^3.3.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  path: ^1.9.0
  url_launcher: ^6.3.0
  just_audio_windows: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/

dependency_overrides:
  path: 1.9.0
